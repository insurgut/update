name: Build Vector Dialer Capsule
on:
  push:
    branches: [vector-dialer-capsule]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "SDK Manager unavailable"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract sources
        run: tar -xzf VectorDialerCapsule-sources.tar.gz
      - name: Assemble Android APK
        run: |
          cd VectorDialerCapsule
          gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VectorDialerCapsule-1.0-debug-apk
          path: VectorDialerCapsule/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
