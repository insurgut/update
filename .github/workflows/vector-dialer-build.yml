name: Build Vector Dialer Capsule
on:
  push:
    branches: [vector-dialer-capsule]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: tar -xzf VectorDialerCapsule-sources.tar.gz
      - name: Assemble Android APK
        run: |
          cd VectorDialerCapsule
          gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VectorDialerCapsule-1.0-debug-apk
          path: VectorDialerCapsule/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
